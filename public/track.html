<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order — La Pizzariô</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Karla:wght@400;500;600;700;800&display=swap&family=Baumans&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F8EFDC;--cream:#FFFAEE;--black:#123A24;--ink:#241F16;--ink-soft:#5C5343;
  --basil:#1E5B38;--basil-deep:#123A24;--brick:#A8271F;--brick-deep:#7E1712;
  --gold:#D9A441;--gold-soft:#F0D9A8;--line:#E3D5B8;--field:#FFFFFF;
  --shadow:0 10px 30px rgba(36,31,22,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh}
.awning{height:12px;background:repeating-linear-gradient(90deg,var(--brick) 0 32px,var(--cream) 32px 64px)}
header{background:var(--basil-deep);color:var(--cream);padding:18px 20px;text-align:center}
.logo{font-family:'Baumans',cursive;font-weight:400;font-size:1.6rem}
.logo em{font-style:normal;color:var(--gold)}
.logo small{display:block;font-family:'Karla';font-weight:700;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-soft)}
.wrap{max-width:560px;margin:0 auto;padding:26px 16px 60px}
.card{background:var(--cream);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
h1{font-family:'Fraunces',serif;font-weight:900;font-size:1.45rem;margin-bottom:2px}
.sub{color:var(--ink-soft);font-size:.86rem;font-weight:700;margin-bottom:4px}
.big-status{font-family:'Fraunces',serif;font-weight:900;font-size:1.25rem;color:var(--basil);margin:12px 0 4px}
.big-status.cancel{color:var(--brick)}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--basil);margin-right:8px;animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}

/* timeline */
.steps{margin:18px 0 4px}
.step{display:flex;gap:14px;position:relative;padding-bottom:26px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:3px;background:var(--line);border-radius:99px}
.step:last-child::before{display:none}
.step.done::before{background:var(--basil)}
.dot{flex:none;width:33px;height:33px;border-radius:50%;border:3px solid var(--line);background:var(--cream);display:grid;place-items:center;font-size:.95rem;z-index:1}
.step.done .dot{border-color:var(--basil);background:#E9F3EA}
.step.now .dot{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 5px rgba(217,164,65,.25)}
.step b{display:block;font-size:.95rem;padding-top:5px}
.step small{color:var(--ink-soft);font-size:.76rem;font-weight:600}
.step.todo b,.step.todo .dot{opacity:.45}

/* driver */
.driver{display:flex;align-items:center;gap:14px;background:linear-gradient(140deg,var(--basil),var(--basil-deep));color:var(--cream);border-radius:14px;padding:15px 16px;margin-top:14px}
.driver .avatar{flex:none;width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.15rem;font-family:'Fraunces',serif}
.driver b{font-size:1rem}
.driver small{display:block;color:var(--gold-soft);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.driver a.call{margin-left:auto;background:var(--gold);color:var(--ink);text-decoration:none;font-weight:900;font-size:.85rem;padding:10px 16px;border-radius:999px;white-space:nowrap}
.driver-wait{background:#FBF1D8;border:1px dashed var(--gold);border-radius:12px;padding:11px 14px;font-size:.8rem;font-weight:700;color:#7a5a12;margin-top:14px}

/* summary */
h2{font-family:'Fraunces',serif;font-weight:900;font-size:1.1rem;margin-bottom:10px}
.it-row{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.it-row>span:first-child{min-width:0;overflow-wrap:break-word}
.it-row>span:last-child{flex:none;white-space:nowrap}
.it-row span:last-child{font-weight:800;white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:1.02rem;padding-top:10px}
.save{color:var(--basil);font-weight:800}
.pill{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:999px;background:var(--gold-soft);color:#7a5a12;margin-top:8px}
.err-box{text-align:center;padding:30px 10px}
.err-box b{display:block;font-size:2.4rem;margin-bottom:8px}
.foot{text-align:center;color:var(--ink-soft);font-size:.72rem;font-weight:700;padding-top:6px}
.lookup input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-family:inherit;font-size:1rem;background:var(--field);color:var(--ink);margin:10px 0 8px}
.lookup input::placeholder{color:#A99C82}
.lookup input:focus{outline:none;border-color:var(--basil);box-shadow:0 0 0 3px rgba(30,91,56,.14)}
.lookup button{width:100%;background:var(--brick);color:#fff;font-weight:900;font-size:1rem;padding:14px;border-radius:12px;border:none;cursor:pointer;box-shadow:0 4px 0 var(--brick-deep);font-family:inherit}
.lookup button:active{transform:translateY(3px);box-shadow:none}
.lk-err{color:var(--brick);font-weight:800;font-size:.82rem;margin-top:8px;display:none}
.ord-link{display:flex;align-items:center;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px;text-decoration:none;color:var(--ink)}
.ord-link:hover{border-color:var(--basil);background:#F1F6EE}
.ord-link .st{margin-left:auto;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--gold-soft);color:#7a5a12;white-space:nowrap}
.ord-link b{display:block;font-family:'Fraunces',serif}
.ord-link small{color:var(--ink-soft);font-weight:700;font-size:.74rem}
</style>
</head>
<body>
<div class="awning"></div>
<header>
  <div class="logo">La <em>Pizzariô</em><small>Live Order Tracking</small></div>
</header>

<div class="wrap">
  <div class="card" id="statusCard">
    <div class="err-box"><b>🍕</b>Loading your order…</div>
  </div>
  <div class="card" id="summaryCard" style="display:none"></div>
  <p class="foot" id="foot">Updates automatically every few seconds — keep this page open.</p>
</div>

<script>
const INR = n => '₹' + Number(n||0).toLocaleString('en-IN');
const esc = s => String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function getOid(){
  const parts = location.pathname.split('/').filter(Boolean);
  if(parts[0]==='track' && parts[1]) return parts[1];
  return new URLSearchParams(location.search).get('oid') || '';
}
const OID = getOid();

const STEP_IDX = {PAID:0, CREATED:-1, PREPARING:1, READY:2, DONE:3, CANCELLED:-2};

function timeOf(history, statuses){
  for(const s of statuses){
    const h = (history||[]).find(x=>x.s===s);
    if(h) return new Date(h.t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  }
  return '';
}

function render(o){
  const sc = document.getElementById('statusCard');
  const sum = document.getElementById('summaryCard');
  const idx = STEP_IDX[o.status];
  const isDelivery = o.type==='Delivery';

  if(o.status==='CANCELLED'){
    sc.innerHTML = `
      <h1>Order ${esc(o.oid)}</h1>
      <div class="sub">${o.type} · ${esc(o.branch)} branch</div>
      <div class="big-status cancel">⛔ This order was cancelled</div>
      <p style="font-size:.86rem;color:var(--ink-soft)">Please contact the ${esc(o.branch)} branch for details — online payments are refunded via the payment gateway.</p>`;
  } else if(o.status==='CREATED'){
    sc.innerHTML = `
      <h1>Order ${esc(o.oid)}</h1>
      <div class="sub">${o.type} · ${esc(o.branch)} branch</div>
      <div class="big-status" style="color:#8a5f0e">🕐 Waiting for payment</div>
      <p style="font-size:.86rem;color:var(--ink-soft)">This order's online payment hasn't been completed yet. Once paid, tracking starts automatically.</p>`;
  } else {
    const steps = [
      {icon:'✅', label:'Order confirmed', small: 'Paid online · ' + timeOf(o.history,['PAID']), key:0},
      {icon:'🍳', label:'Being prepared', small: timeOf(o.history,['PREPARING']) || 'Fresh in our oven', key:1},
      {icon: isDelivery?'🛵':'📦', label: isDelivery?'Out for delivery':'Ready for pickup', small: timeOf(o.history,['READY']) || (isDelivery?'Rider details appear here':'Ready at the counter'), key:2},
      {icon:'🎉', label: isDelivery?'Delivered':'Picked up', small: timeOf(o.history,['DONE']) || 'Enjoy your meal!', key:3},
    ];
    const nowText = ['Your order is confirmed — the kitchen has been notified!','Your order is being prepared right now!', isDelivery?'Your order is on its way to you!':'Your order is ready — come grab it!','Order completed — enjoy! 🍕'][idx] || '';
    sc.innerHTML = `
      <h1>Hi ${esc(o.firstName||'')}! Order ${esc(o.oid)}</h1>
      <div class="sub">${o.type} · ${esc(o.branch)} branch · placed ${new Date(o.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>
      <div class="big-status">${idx<3?'<span class="pulse"></span>':''}${esc(nowText)}</div>
      <div class="steps">
        ${steps.map(s=>`
          <div class="step ${s.key<idx?'done':s.key===idx?'now':'todo'} ${s.key<=idx?'':''}">
            <div class="dot">${s.icon}</div>
            <div><b>${s.label}</b><small>${esc(s.small)}</small></div>
          </div>`).join('')}
      </div>
      ${isDelivery ? (
        o.driver && o.driver.name
        ? `<div class="driver">
             <div class="avatar">${esc(o.driver.name.trim()[0].toUpperCase())}</div>
             <div><small>Your delivery rider</small><b>${esc(o.driver.name)}</b></div>
             ${o.driver.phone?`<a class="call" href="tel:+91${esc(o.driver.phone)}">📞 Call</a>`:''}
           </div>`
        : (idx<2 ? `<div class="driver-wait">🛵 Your delivery rider's name & phone number will appear here automatically once your order leaves the kitchen.</div>` : '')
      ) : ''}`;
  }

  sum.style.display='block';
  sum.innerHTML = `
    <h2>Order summary</h2>
    ${(o.items||[]).map(i=>`<div class="it-row"><span>${esc(i.name)}${i.variant?' ('+esc(i.variant)+')':''}${i.opt?' · '+esc(i.opt):''} × ${i.qty}</span><span>${INR(i.price*i.qty)}</span></div>`).join('')}
    ${o.discount>0?`<div class="it-row save"><span>BOGO discount</span><span>−${INR(o.discount)}</span></div>`:''}
    <div class="tot"><span>Total</span><span>${INR(o.total)}</span></div>
    <span class="pill">✅ Paid online</span>`;

  if(o.status==='DONE'||o.status==='CANCELLED'){
    clearInterval(timer);
    document.getElementById('foot').textContent = 'This order is complete. Thank you for choosing La Pizzariô! 🍕';
  }
}

function fail(msg){
  document.getElementById('statusCard').innerHTML =
    `<div class="err-box"><b>😕</b><strong>${esc(msg)}</strong><br><span style="font-size:.85rem;color:var(--ink-soft)">Check the tracking link from your confirmation email — or <a href="/track" style="font-weight:800;color:var(--brick)">find your order by mobile number</a>.</span></div>`;
}

const ST_TXT = {PAID:'Confirmed', PREPARING:'Preparing', READY:'On its way', DONE:'Completed', CANCELLED:'Cancelled'};
function savedOrders(){
  try{ return JSON.parse(localStorage.getItem('lp_orders')||'[]'); }catch(e){ return []; }
}
function orderLinkHTML(o){
  return `<a class="ord-link" href="/track/${esc(o.oid)}">
    <span style="font-size:1.3rem">🍕</span>
    <span><b>${esc(o.oid)}</b><small>${o.branch?esc(o.branch)+' · ':''}${o.type?esc(o.type)+' · ':''}${o.total?INR(o.total)+' · ':''}${new Date(o.ts||o.t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</small></span>
    <span class="st">${ST_TXT[o.status]||'Track →'}</span>
  </a>`;
}
function renderLookup(){
  clearInterval(timer);
  document.getElementById('foot').textContent = 'Orders from the last 24 hours can be found by mobile number.';
  const recent = savedOrders().filter(o=>Date.now()-o.t < 24*60*60*1000);
  document.getElementById('statusCard').innerHTML = `
    <h1>Track your order</h1>
    <div class="sub">Enter the mobile number you ordered with</div>
    <div class="lookup">
      <input id="lkPhone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number">
      <button onclick="doLookup()">🔎 Find my orders</button>
      <div class="lk-err" id="lkErr"></div>
      <div id="lkResults"></div>
    </div>
    ${recent.length?`<h2 style="margin-top:22px">Recent orders on this device</h2>${recent.map(o=>orderLinkHTML(o)).join('')}`:''}`;
  document.getElementById('lkPhone').addEventListener('keydown',e=>{if(e.key==='Enter')doLookup();});
}
async function doLookup(){
  const phone = document.getElementById('lkPhone').value.trim();
  const err = document.getElementById('lkErr');
  const box = document.getElementById('lkResults');
  err.style.display='none'; box.innerHTML='';
  if(!/^[6-9]\d{9}$/.test(phone)){ err.textContent='Please enter a valid 10-digit mobile number.'; err.style.display='block'; return; }
  try{
    const r = await fetch('/api/orders/lookup?phone='+phone);
    const d = await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||'Lookup failed.');
    box.innerHTML = d.orders.length
      ? d.orders.map(o=>orderLinkHTML(o)).join('')
      : '<div class="lk-err" style="display:block">No orders found for this number in the last 24 hours.</div>';
  }catch(e){ err.textContent=e.message; err.style.display='block'; }
}

async function load(){
  if(!OID){ renderLookup(); return; }
  try{
    const r = await fetch('/api/orders/'+encodeURIComponent(OID));
    const d = await r.json();
    if(!r.ok || !d.ok){ fail(d.error||'Order not found.'); clearInterval(timer); return; }
    render(d);
    try{
      const list = savedOrders().filter(x=>x.oid!==d.oid);
      list.unshift({oid:d.oid, t:Date.now(), status:d.status, total:d.total, type:d.type, branch:d.branch, ts:d.ts});
      localStorage.setItem('lp_orders', JSON.stringify(list.slice(0,5)));
    }catch(e){}
  }catch(e){
    document.getElementById('foot').textContent='Connection lost — retrying…';
  }
}
let timer = setInterval(load, 8000);
load();
</script>
</body>
</html>
